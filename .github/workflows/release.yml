name: Build and Release

# Trigger the workflow only when a tag starting with "v" is pushed
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    
    # Matrix strategy to build for Linux, Windows, and macOS
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            name: monero-pay-linux-amd64
          - os: windows
            arch: amd64
            name: monero-pay-windows-amd64.exe
          - os: darwin # macOS
            arch: amd64
            name: monero-pay-darwin-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # Specify the Go version used for building

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          # Changed from ./main.go to . to compile the current module
          go build -o ${{ matrix.name }} . 

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
