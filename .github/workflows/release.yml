name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            name: monero-pay-linux-amd64
          - os: windows
            arch: amd64
            name: monero-pay-windows-amd64.exe
          - os: darwin # macOS
            arch: amd64
            name: monero-pay-darwin-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' 

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          # Navigate into the nested directory where the actual code and go.mod are located
          cd monero-pay/monero-pay/monero-pay
          
          # Build the binary and save it to the root workspace directory so the next step can find it
          go build -o $GITHUB_WORKSPACE/${{ matrix.name }} . 

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
