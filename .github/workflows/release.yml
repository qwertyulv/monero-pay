name: Build and Release

on:
  push:
    tags:
      - 'v*'

# Grant write permissions so the bot can upload files to the Release page
permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            name: monero-pay-linux-amd64
          - os: windows
            arch: amd64
            name: monero-pay-windows-amd64.exe
          - os: darwin # macOS
            arch: amd64
            name: monero-pay-darwin-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' 

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          # 1. Automatically find the folder containing .go files
          GO_DIR=$(dirname $(find . -name "*.go" | head -n 1))
          echo "Found Go code in: $GO_DIR"
          
          # 2. Automatically enter that folder
          cd $GO_DIR
          
          # 3. Build and output to the main workspace
          go build -o $GITHUB_WORKSPACE/${{ matrix.name }} . 

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
